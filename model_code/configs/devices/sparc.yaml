# SPARC 托卡马克器件参数 (compact, original baseline)
# 仅含"原始输入"参数; 派生量由 config.py 自动计算。
device: sparc

# ---- 几何 ----
NP: 16               # 每个 TF 线圈饼数 Nc
L1: 3.0              # TF 线圈高度方向尺寸 (m)
R1: 0.40             # 内半径相关 (m)
R2: 0.30             # 绕组包径向厚 (m)
WID: 0.004           # HTS 带宽 (m)  4 mm
DIST: 0.010          # 饼间距 (m)    10 mm
N_TOTAL_TAPE: 2000   # 20K 每饼带材数

# ---- 各温度运行点 ----
Ip_list:             # 单带运行电流 (A)
  4.2: 350.0
  10.0: 300.0
  20.0: 210.0
Nt_list:             # 每饼带材数
  4.2: 1200
  10.0: 1400
  20.0: 2000

# ---- 电厂 ----
P_fusion_W: 140000000.0      # 聚变功率 (W) 140 MW
eat_conv: 0.35               # 热电转化效率
NUCLEAR_POWER_DENSITY: 600.0 # 核功率密度 (W/m^3)

# ---- 器件相关数据文件 ----
TF_SYSTEM_MATRIX: "TF_system_L_matrix.xlsx"      # 18x18 单匝互感 (R2=0.30)
MAG_LOSS_FILE: "mag loss.bak_sparc.xlsx"         # T-A 磁化损耗表 (SPARC)
RADIAL_LOSS_FILE: "radial loss.bak_sparc.xlsx"   # T-A 径向损耗表 (SPARC)
