# ARC 组合变体: 16 饼 (Nc=16) + 核密度 600 W/m³ (= SPARC 值, vs ARC 421)。
# = arc_16_pancake (FEM 的 Ip/Nt) 叠加 arc_high_nuclear_heat 的核密度。
# 用于看"饼数+高核密度"两个不利因素叠加对再循环/LCOE 的影响。
# Ip/Nt: 统一到 T-A 扫描口径(Nt 取 50 整倍满足三段等匝几何, Ip 按安匝 8.4MA 反算), 2026-07-02。
# 全链路(T-A损耗/充电/可用度/热负荷/经济/图/正文/SI)统一用此组, 保证数据集一致。
# 安匝 = Nc(16)*Nt*Ip = 8.4MA (三温守恒), maxB=24.1T。
# was FEM-resolve 值 Ip=730/620/460, Nt=719/847/1141 (安匝同 8.4MA, 差 ~2% 取整口径)。
device: arc_16pancake_nuc600

# ---- 几何 (同 arc_16_pancake) ----
NP: 16
L1: 7.24
R1: 0.30
R2: 0.64
WID: 0.012
DIST: 0.003
N_TOTAL_TAPE: 1150

# ---- 各温度运行点 (统一 T-A 口径: Nt÷50, Ip=8.4MA/(16*Nt)) ----
Ip_list:
  4.2: 750.0
  10.0: 617.6
  20.0: 456.5
Nt_list:
  4.2: 700
  10.0: 850
  20.0: 1150

# ---- 电厂 (同 ARC, 仅核密度改为 600) ----
P_fusion_W: 525000000.0
eat_conv: 0.40
NUCLEAR_POWER_DENSITY: 600.0          # 421 -> 600 W/m³

# ---- 数据文件 (沿用 ARC) ----
TF_SYSTEM_MATRIX: "TF_system_L_matrix_ARC.xlsx"
MAG_LOSS_FILE: "data_s3_magnetization_loss.xlsx"
RADIAL_LOSS_FILE: "data_s2_radial_loss.xlsx"

# ---- 器件物理量 (A 类, 2026-07-26 由 device.py 硬编码迁入; 见 ARC-参数归属清单.md) ----
Ntf: 18
Ic0_cm: 400
RHO_TAPE: 5.0e-09
LEN_PER_SINGEL_REBCO: 200.0
carrying_factor: 0.7
R_SU_JOINT: 1.0e-08
eps: 0.03
N_LAYER_CRYOSTAT: 30
L_LEAD_HTS: 0.5
T_HOT_HTS_LEAD: 77.0
LEN_LEAD_CU: 1.0
design_factor: 5000000.0
N_LEAD: 2
d_in_cool: 0.02
d_out_cool: 0.022
d_in_aux: 0.01
d_out_aux: 0.012
N_cool_pipe: 2
L_cool: 1.0
N_aux_pipe: 2
L_aux: 1.0
JOINT_WIDTH: 12.0
JOINT_LENGTH: 200.0
JOINT_PRESSURE: 75.0
Q_OTHER_SOURCES: 10.0
RRR: 100
INTK_CU30: 42853.56
Temp_transfer: 150.0
Time_transfer: 5.0

# ---- 模型判据与数值方法 (B 类) ----
CHARGE_HOURS: 96
T_HIGH: 300
ceff_77to20: 5
POINTS_PER_TURN: 200
MAX_TEMP_RUN: 21
P0_HE_BAR: 10.0
P0_H2_BAR: 10.0
P_REF: 10.0
