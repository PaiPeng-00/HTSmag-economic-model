# ARC 变体: 核热密度=600 (=SPARC值), 隔离核热基底影响. 其余同 ARC器件参数 (commercial fusion replica)
# 仅含"原始输入"参数; 派生量(V_magnet, S_magnet, L_HTS_*, TEMPERATURE_CASES 等)由 config.py 自动计算。
device: arc_high_nuclear_heat

# ---- 几何 (FEM 值) ----
NP: 12               # 每个 TF 线圈饼数 Nc
L1: 7.24             # TF 线圈高度方向尺寸 (m)
R1: 0.30             # 内半径相关 (m)
R2: 0.64             # 绕组包径向厚 = dr_tf (m)
WID: 0.012           # HTS 带宽 (m)  12 mm
DIST: 0.003          # 饼间距 (m)    3 mm
N_TOTAL_TAPE: 1750   # 20K 每饼带材数 = FEM Nt(20K); 安匝 Nt*NP*Ip = 8.4 MA

# ---- 各温度运行点 (FEM, 载流比 0.7) ----
Ip_list:             # 单带运行电流 (A)
  4.2: 700.0
  10.0: 583.0
  20.0: 400.0
Nt_list:             # 每饼带材数
  4.2: 1000
  10.0: 1200
  20.0: 1750

# ---- 电厂 ----
P_fusion_W: 525000000.0      # 聚变功率 (W) 525 MW
eat_conv: 0.40               # 热电转化效率
NUCLEAR_POWER_DENSITY: 600.0 # 核功率密度 (W/m^3); 722 W/TF / V_magnet=1.72 m^3

# ---- 器件相关数据文件 ----
TF_SYSTEM_MATRIX: "TF_system_L_matrix_ARC.xlsx"  # CP4 生成的 18x18 单匝互感 (R2=0.64)
MAG_LOSS_FILE: "data_s3_magnetization_loss.xlsx"                    # T-A 磁化损耗表
RADIAL_LOSS_FILE: "data_s2_radial_loss.xlsx"             # T-A 径向损耗表
