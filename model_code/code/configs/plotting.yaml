# 绘图样式配置 (E 类)。
# 2026-07-26 由 device.py 迁出。这些是渲染参数, 不影响任何数值结果,
# 但原先占了 device.py 近半篇幅。device.py 仍以同名属性暴露 (_plot 读取,
# 本文件缺失或缺键时回落到代码内缺省), 因此下游 cfg.XXX 引用一律不变。
# 见 0-思路/ARC-参数归属清单.md 与工作文档 §14.45。

PLOT_FORMAT: "svg"
PLOT_DPI: 1800
PLOT_TRANSPARENT: true
color_schemes: 
  - "viridis"
  - "plasma"
  - "inferno"
  - "magma"
  - "cividis"
  - "Blues"
  - "YlGnBu"
  - "PuBuGn"
  - "mako"
  - "rocket"
cmap_parasitic_ratio: "cividis"
LCOE_CONTOUR_METHOD: "fixed"
DELTA_LCOE_MASK_PARASITIC_PCT: 50.0
DELTA_LCOE_ABS_PCTL: 99.5
DELTA_LCOE_LINTHRESH_USD: 0.1
DELTA_LCOE_LINSCALE_USD: 0.5
DELTA_LCOE_LINTHRESH_CNY: 0.001
DELTA_LCOE_LINSCALE_CNY: 0.5
CONTOUR_TARGET_COUNT: 5
CONTOUR_MIN_SPACING_USD: 0.1
CONTOUR_MIN_SPACING_CNY: 0.001
USE_STROKE: true
CONTOUR_STROKE_LINEWIDTH: 4
CONTOUR_STROKE_LINEWIDTH_ZERO: 5
CONTOUR_STROKE_LINEWIDTH_AF: 2.0
CONTOUR_STROKE_FOREGROUND: "white"
CONTOUR_STROKE_ALPHA: 0.9
LABEL_STROKE_LINEWIDTH: 4
LABEL_STROKE_FOREGROUND: "white"
LABEL_STROKE_ALPHA: 0.8
HEATMAP_ALPHA: 0.8
HEATMAP_FONT_SIZE: 18
HEATMAP_FONT_SIZE_TICK: 20
HEATMAP_FONT_SIZE_TITLE: 24
HEATMAP_FONT_SIZE_COLORBAR: 18
HEATMAP_FONT_SIZE_COLORBAR_TITLE: 24
HEATMAP_FIGSIZE_SINGLE: 
  - 5
  - 5
HEATMAP_FIGSIZE_GRID: 
  - 15
  - 5
HEATMAP_FIGSIZE_COLORBAR: 
  - 0.5
  - 6
HEATMAP_FIGSIZE_COLORBAR_LARGE: 
  - 3.0
  - 6.0
HEATMAP_CONTOUR_LINEWIDTH: 2
HEATMAP_CONTOUR_LINEWIDTH_ZERO: 3
HEATMAP_CONTOUR_LINEWIDTH_AF: 2
HEATMAP_CONTOUR_LINEWIDTH_CRYO: 2
HEATMAP_CONTOUR_FMT_PARASITIC: "%.1f"
HEATMAP_CONTOUR_FMT_LCOE: "%.2f"
HEATMAP_CONTOUR_FMT_AF: "%.2f"
HEATMAP_CONTOUR_FMT_CRYO: "%.2f"
